<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="A beluga whale swimming through a Catppuccin Mocha ocean">
  <title>A beluga whale drifting past the kelp</title>

  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="55%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>

    <radialGradient id="moonglow" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#cba6f7" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#cba6f7" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b4befe" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#b4befe" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2f4fb"/>
      <stop offset="50%" stop-color="#cdd6f4"/>
      <stop offset="100%" stop-color="#9aa3c6"/>
    </linearGradient>

    <linearGradient id="kelp" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#94e2d5"/>
      <stop offset="100%" stop-color="#a6e3a1"/>
    </linearGradient>

    <g id="fish">
      <path d="M7,0 C7,-4 3,-7 -2,-7 C-8,-7 -12,-4 -12,0 C-12,4 -8,7 -2,7 C3,7 7,4 7,0 Z"/>
      <path d="M-11,0 L-20,-6 L-18,0 L-20,6 Z"/>
      <circle cx="1" cy="-2" r="1.4" fill="#11111b"/>
    </g>
  </defs>

  <style>
    .sway, .bob, .fluke, .flip, .bub, .glim { transform-box: fill-box; }

    .swim   { animation: swim 26s linear infinite; }
    .bob    { animation: bob 4.4s ease-in-out infinite; }
    .fluke  { animation: fluke 1.8s ease-in-out infinite; transform-origin: 100% 50%; }
    .flip   { animation: flip 2.6s ease-in-out infinite; transform-origin: 90% 10%; }
    .sway   { animation: sway 6s ease-in-out infinite; transform-origin: 50% 100%; }
    .bub    { animation: rise 7s ease-in infinite; transform-origin: 50% 50%; }
    .glim   { animation: glim 5s ease-in-out infinite; }
    .drift1 { animation: drift1 19s linear infinite; }
    .drift2 { animation: drift2 24s linear infinite; }

    @keyframes swim   { from { transform: translateX(-190px); } to { transform: translateX(1090px); } }
    @keyframes bob    { 0%,100% { transform: translateY(0); }  50% { transform: translateY(-11px); } }
    @keyframes fluke  { 0%,100% { transform: rotate(-11deg); } 50% { transform: rotate(11deg); } }
    @keyframes flip   { 0%,100% { transform: rotate(-7deg); }  50% { transform: rotate(14deg); } }
    @keyframes sway   { 0%,100% { transform: rotate(-4deg); }  50% { transform: rotate(4deg); } }
    @keyframes glim   { 0%,100% { opacity: .25; } 50% { opacity: .7; } }
    @keyframes rise   { 0% { transform: translateY(0) scale(.5); opacity: 0; }
                        15% { opacity: .75; }
                        100% { transform: translateY(-150px) scale(1.15); opacity: 0; } }
    @keyframes drift1 { from { transform: translateX(940px); } to { transform: translateX(-60px); } }
    @keyframes drift2 { from { transform: translateX(-60px); } to { transform: translateX(940px); } }

    .b2 { animation-delay: -1.4s } .b3 { animation-delay: -2.8s }
    .b4 { animation-delay: -4.2s } .b5 { animation-delay: -5.6s }
    .k2 { animation-delay: -1.1s } .k3 { animation-delay: -2.3s }
    .k4 { animation-delay: -3.4s } .k5 { animation-delay: -0.6s }
    .g2 { animation-delay: -1.7s } .g3 { animation-delay: -3.1s } .g4 { animation-delay: -2.2s }

    @media (prefers-reduced-motion: reduce) {
      .swim, .bob, .fluke, .flip, .sway, .bub, .glim, .drift1, .drift2 { animation: none; }
    }
  </style>

  <rect width="900" height="240" rx="10" fill="url(#sea)"/>
  <rect width="900" height="240" rx="10" fill="url(#moonglow)"/>

  <!-- shafts of light from the surface -->
  <g opacity="0.9">
    <polygon class="glim"    points="120,0 190,0 130,240 60,240"  fill="url(#ray)"/>
    <polygon class="glim g2" points="420,0 470,0 430,240 370,240" fill="url(#ray)"/>
    <polygon class="glim g3" points="700,0 780,0 740,240 650,240" fill="url(#ray)"/>
  </g>

  <!-- distant motes -->
  <g fill="#b4befe">
    <circle class="glim"    cx="90"  cy="52"  r="1.6"/>
    <circle class="glim g2" cx="250" cy="34"  r="1.2"/>
    <circle class="glim g3" cx="470" cy="66"  r="1.7"/>
    <circle class="glim g4" cx="640" cy="40"  r="1.3"/>
    <circle class="glim g2" cx="810" cy="70"  r="1.5"/>
    <circle class="glim g3" cx="350" cy="96"  r="1.2"/>
  </g>

  <!-- little fish drifting the other way -->
  <g class="drift1"><g transform="translate(0,74)"><use href="#fish" fill="#f5c2e7" transform="scale(0.8)"/></g></g>
  <g class="drift2"><g transform="translate(0,168)"><use href="#fish" fill="#fab387" transform="scale(0.65) rotate(180)"/></g></g>

  <!-- sea floor -->
  <path d="M0,240 L0,214 C120,196 220,222 330,210 C450,197 560,224 690,208 C790,196 850,214 900,204 L900,240 Z" fill="#313244"/>
  <path d="M0,240 L0,226 C140,214 240,234 360,224 C500,212 600,232 720,222 C820,214 860,228 900,220 L900,240 Z" fill="#45475a" opacity="0.55"/>

  <!-- kelp -->
  <g stroke="url(#kelp)" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.85">
    <path class="sway"    d="M70,222 C58,192 82,170 68,140  C58,118 76,102 70,84"/>
    <path class="sway k2" d="M150,228 C140,204 160,186 150,162 C142,144 156,130 150,116"/>
    <path class="sway k3" d="M760,224 C748,196 772,176 758,148 C748,128 766,112 760,96"/>
    <path class="sway k4" d="M840,230 C830,208 848,190 838,166 C830,148 844,136 838,122"/>
    <path class="sway k5" d="M300,232 C292,214 306,200 298,182"/>
  </g>

  <!-- rising bubbles -->
  <g fill="none" stroke="#89dceb" stroke-width="1.4" opacity="0.7">
    <circle class="bub"    cx="120" cy="214" r="3.4"/>
    <circle class="bub b2" cx="136" cy="220" r="2.2"/>
    <circle class="bub b3" cx="756" cy="216" r="3"/>
    <circle class="bub b4" cx="772" cy="222" r="2"/>
    <circle class="bub b5" cx="300" cy="224" r="2.6"/>
  </g>

  <!-- the beluga -->
  <g class="swim">
    <g transform="translate(0,116)">
      <g class="bob">
        <g transform="scale(1.06)">

          <!-- tail -->
          <g class="fluke">
            <path d="M-44,0 C-53,-6 -66,-17 -73,-12 C-78,-8 -70,-3 -59,0 C-70,3 -78,8 -73,12 C-66,17 -53,6 -44,0 Z"
                  fill="#b9c2e2"/>
          </g>

          <!-- rear flipper shadow -->
          <g class="flip">
            <path d="M2,17 C-4,28 -19,35 -25,30 C-30,26 -18,17 -4,14 Z" fill="#8d96b8"/>
          </g>

          <!-- body -->
          <path d="M58,0 C58,-14 41,-24 17,-24 C-11,-24 -34,-14 -46,-4 C-48,-2 -48,2 -46,4
                   C-34,14 -11,24 17,24 C41,24 58,14 58,0 Z" fill="url(#body)"/>

          <!-- melon highlight -->
          <path d="M52,-7 C48,-17 36,-21 24,-20 C36,-15 45,-11 52,-7 Z" fill="#ffffff" opacity="0.5"/>

          <!-- near flipper -->
          <g class="flip">
            <path d="M10,16 C4,27 -11,34 -17,29 C-22,25 -10,16 4,13 Z" fill="#aeb7d8"/>
          </g>

          <!-- face -->
          <circle cx="40" cy="-6" r="2.6" fill="#11111b"/>
          <path d="M50,7 C45,10 39,11 34,10" stroke="#8d96b8" stroke-width="1.6" fill="none" stroke-linecap="round"/>

          <!-- blowhole spout -->
          <g fill="none" stroke="#89dceb" stroke-width="1.3" opacity="0.75">
            <circle class="bub"    cx="20" cy="-24" r="2.4"/>
            <circle class="bub b3" cx="26" cy="-26" r="1.6"/>
          </g>

        </g>
      </g>
    </g>
  </g>
</svg>
